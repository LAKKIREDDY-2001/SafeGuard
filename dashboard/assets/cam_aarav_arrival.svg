<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Daylight Fisheye Vignette -->
    <radialGradient id="vignetteDay" cx="50%" cy="50%" r="60%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Warm Afternoon Sunlight -->
    <linearGradient id="afternoonSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND: DAYLIGHT PORCH SCENE -->
  <rect width="640" height="360" fill="#64748B"/>

  <!-- Bright Sky & Trees -->
  <rect x="0" y="0" width="640" height="170" fill="#7DD3FC"/>
  <!-- Trees / Greenery in Background -->
  <circle cx="120" cy="140" r="70" fill="#15803D" opacity="0.8"/>
  <circle cx="180" cy="130" r="60" fill="#16A34A" opacity="0.9"/>
  <circle cx="500" cy="130" r="75" fill="#15803D" opacity="0.85"/>
  <circle cx="560" cy="140" r="65" fill="#16A34A" opacity="0.9"/>

  <!-- Walkway & Lawn -->
  <polygon points="140,170 500,170 640,360 0,360" fill="#475569"/>
  <polygon points="210,180 430,180 470,230 170,230" fill="#94A3B8"/>
  <polygon points="170,230 470,230 520,295 120,295" fill="#CBD5E1"/>
  <polygon points="120,295 520,295 570,360 70,360" fill="#E2E8F0"/>

  <!-- Porch Pillars -->
  <rect x="70" y="30" width="42" height="330" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="528" y="30" width="42" height="330" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="0,0 640,0 580,45 60,45" fill="#E2E8F0"/>

  <!-- Door Frame -->
  <rect x="230" y="55" width="180" height="195" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
  <rect x="245" y="70" width="22" height="165" fill="#38BDF8" opacity="0.3" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="373" y="70" width="22" height="165" fill="#38BDF8" opacity="0.3" stroke="#0284C7" stroke-width="1.5"/>

  <!-- Welcome Mat -->
  <rect x="270" y="255" width="100" height="38" rx="4" fill="#B45309" stroke="#92400E" stroke-width="1.5"/>
  <text x="320" y="278" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FEF3C7" text-anchor="middle">WELCOME</text>

  <!-- AARAV FIGURE (CHILD ARRIVING WITH BLUE BACKPACK) -->
  <g transform="translate(305, 140)">
    <!-- Shadow -->
    <ellipse cx="18" cy="170" rx="28" ry="10" fill="#000000" opacity="0.35"/>

    <!-- Blue School Backpack on Back -->
    <rect x="-8" y="42" width="18" height="38" rx="6" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5"/>
    <rect x="-6" y="50" width="14" height="20" rx="3" fill="#2563EB"/>

    <!-- Legs & Jeans -->
    <path d="M7 105 L10 165 L17 165 L18 115 L20 115 L21 165 L28 165 L31 105 Z" fill="#1E3A8A"/>
    <!-- Yellow/Red Sneakers -->
    <rect x="8" y="162" width="12" height="6" rx="2" fill="#DC2626"/>
    <rect x="20" y="162" width="12" height="6" rx="2" fill="#DC2626"/>

    <!-- Red/Navy Striped Polo Shirt -->
    <path d="M0 38 L36 38 L39 110 L-3 110 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
    <!-- Navy Stripes -->
    <rect x="-1" y="52" width="38" height="6" fill="#1E3A8A"/>
    <rect x="-2" y="72" width="40" height="6" fill="#1E3A8A"/>
    <rect x="-2" y="92" width="40" height="6" fill="#1E3A8A"/>

    <!-- Head & Hair (Kid) -->
    <ellipse cx="18" cy="22" rx="11" ry="13" fill="#D97706"/>
    <!-- Dark Hair -->
    <path d="M7 16 C7 6, 29 6, 29 16 C30 18, 28 24, 27 24 C25 15, 11 15, 9 24 Z" fill="#1C1917"/>

    <!-- Aarav Smiling Face Profile -->
    <circle cx="21" cy="20" r="1.5" fill="#1C1917"/>
    <path d="M19 25 Q23 28 25 24" stroke="#92400E" stroke-width="1.2" fill="none"/>
  </g>

  <!-- AI REKOGNITION EMERALD BOUNDING BOX -->
  <g transform="translate(285, 135)">
    <!-- Safe Green Bounding Box -->
    <rect x="0" y="0" width="76" height="180" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="2" stroke-dasharray="6 3"/>

    <!-- Corner Brackets -->
    <path d="M -4 14 L -4 -4 L 14 -4" stroke="#10B981" stroke-width="3" fill="none"/>
    <path d="M 62 -4 L 80 -4 L 80 14" stroke="#10B981" stroke-width="3" fill="none"/>
    <path d="M -4 166 L -4 184 L 14 184" stroke="#10B981" stroke-width="3" fill="none"/>
    <path d="M 62 184 L 80 184 L 80 166" stroke="#10B981" stroke-width="3" fill="none"/>

    <!-- Facial Recognition Reticle -->
    <circle cx="38" cy="27" r="15" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="38" cy="27" r="2.5" fill="#10B981"/>

    <!-- Floating HUD Tag Badge -->
    <g transform="translate(-18, -34)">
      <rect x="0" y="0" width="144" height="26" rx="4" fill="rgba(6, 78, 59, 0.95)" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="10" cy="13" r="4" fill="#10B981"/>
      <text x="20" y="11" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#A7F3D0">AARAV REDDY (10)</text>
      <text x="20" y="21" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#6EE7B7">Family Safe • 99.1% Match</text>
    </g>

    <!-- Auto-Lock Status -->
    <g transform="translate(-8, 190)">
      <rect x="0" y="0" width="94" height="16" rx="3" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
      <text x="47" y="11" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#A7F3D0" text-anchor="middle">🔒 DEADBOLT LOCKED</text>
    </g>
  </g>

  <!-- RING HUD OVERLAY & WATERMARK -->
  <rect x="0" y="0" width="640" height="32" fill="linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0))"/>
  <g transform="translate(14, 10)">
    <circle cx="7" cy="7" r="6" stroke="#00D2FF" stroke-width="1.8" fill="none"/>
    <circle cx="7" cy="7" r="2.5" fill="#00D2FF"/>
    <text x="18" y="11" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">ring</text>
    <text x="46" y="11" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#E2E8F0">Front Doorbell Pro 2 • 1080p HDR</text>
  </g>

  <g transform="translate(565, 12)">
    <circle cx="6" cy="5" r="4.5" fill="#10B981"/>
    <text x="16" y="9" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF">LIVE</text>
  </g>

  <!-- Bottom Bar: Live Timestamp & Sensor Data -->
  <rect x="0" y="328" width="640" height="32" fill="linear-gradient(0deg, rgba(0,0,0,0.7), rgba(0,0,0,0))"/>
  <text x="14" y="348" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#FFFFFF">2026-10-21 15:15:22 EDT • DAYLIGHT COLOR HDR</text>
  <text x="626" y="348" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#38BDF8" text-anchor="end">Wi-Fi -49dBm • Battery 94%</text>

  <!-- Fisheye Vignette -->
  <rect width="640" height="360" fill="url(#vignetteDay)"/>
</svg>
