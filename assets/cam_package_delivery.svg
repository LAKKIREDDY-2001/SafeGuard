<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <radialGradient id="vignettePack" cx="50%" cy="50%" r="60%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- BACKGROUND: DAYLIGHT PORCH -->
  <rect width="640" height="360" fill="#475569"/>

  <!-- Morning Sky & Trees -->
  <rect x="0" y="0" width="640" height="170" fill="#38BDF8"/>
  <circle cx="160" cy="130" r="70" fill="#16A34A" opacity="0.8"/>
  <circle cx="500" cy="130" r="75" fill="#16A34A" opacity="0.8"/>

  <!-- Walkway & Porch -->
  <polygon points="140,170 500,170 640,360 0,360" fill="#334155"/>
  <polygon points="210,180 430,180 470,230 170,230" fill="#64748B"/>
  <polygon points="170,230 470,230 520,295 120,295" fill="#94A3B8"/>
  <polygon points="120,295 520,295 570,360 70,360" fill="#CBD5E1"/>

  <!-- Pillars & Frame -->
  <rect x="70" y="30" width="42" height="330" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <rect x="528" y="30" width="42" height="330" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <rect x="230" y="55" width="180" height="195" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>

  <!-- Welcome Mat -->
  <rect x="270" y="255" width="100" height="42" rx="4" fill="#B45309" stroke="#78350F" stroke-width="2"/>
  <text x="320" y="280" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FEF3C7" text-anchor="middle">WELCOME</text>

  <!-- AMAZON DELIVERY PACKAGE ON WELCOME MAT -->
  <g transform="translate(290, 240)">
    <!-- Box Shadow -->
    <ellipse cx="30" cy="38" rx="35" ry="10" fill="#000000" opacity="0.4"/>

    <!-- Corrugated Cardboard Box -->
    <polygon points="0,15 30,0 60,15 30,30" fill="#D97706" stroke="#B45309" stroke-width="1.5"/>
    <polygon points="0,15 30,30 30,45 0,30" fill="#B45309" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="60,15 30,30 30,45 60,30" fill="#92400E" stroke="#78350F" stroke-width="1.5"/>

    <!-- Prime Smile Tape / Shipping Label -->
    <polygon points="18,18 42,6 45,9 21,21" fill="#1E293B"/>
    <rect x="12" y="25" width="12" height="12" rx="1" fill="#FFFFFF" transform="skewY(-15)"/>
  </g>

  <!-- AI PACKAGE DETECTION EMERALD BOUNDING BOX -->
  <g transform="translate(270, 220)">
    <rect x="0" y="0" width="100" height="75" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="2" stroke-dasharray="6 3"/>
    <path d="M -3 10 L -3 -3 L 10 -3" stroke="#10B981" stroke-width="3" fill="none"/>
    <path d="M 90 -3 L 103 -3 L 103 10" stroke="#10B981" stroke-width="3" fill="none"/>
    <path d="M -3 65 L -3 78 L 10 78" stroke="#10B981" stroke-width="3" fill="none"/>
    <path d="M 90 78 L 103 78 L 103 65" stroke="#10B981" stroke-width="3" fill="none"/>

    <!-- Floating HUD Tag Badge -->
    <g transform="translate(-15, -30)">
      <rect x="0" y="0" width="130" height="24" rx="4" fill="rgba(6, 78, 59, 0.95)" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="10" cy="12" r="4" fill="#10B981"/>
      <text x="20" y="10" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#A7F3D0">PACKAGE DELIVERED</text>
      <text x="20" y="19" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#6EE7B7">USPS Verified • Safe</text>
    </g>
  </g>

  <!-- RING HUD OVERLAY -->
  <rect x="0" y="0" width="640" height="32" fill="linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0))"/>
  <g transform="translate(14, 10)">
    <circle cx="7" cy="7" r="6" stroke="#00D2FF" stroke-width="1.8" fill="none"/>
    <circle cx="7" cy="7" r="2.5" fill="#00D2FF"/>
    <text x="18" y="11" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">ring</text>
    <text x="46" y="11" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#E2E8F0">Front Doorbell Pro 2 • Package Guard Active</text>
  </g>

  <g transform="translate(565, 12)">
    <circle cx="6" cy="5" r="4.5" fill="#10B981"/>
    <text x="16" y="9" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF">SAVED</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="0" y="328" width="640" height="32" fill="linear-gradient(0deg, rgba(0,0,0,0.7), rgba(0,0,0,0))"/>
  <text x="14" y="348" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#FFFFFF">2026-10-21 11:20:00 EDT • MOTION RECORDED (34s)</text>
  <text x="626" y="348" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#34D399" text-anchor="end">Protected by Ring Package Guard</text>

  <rect width="640" height="360" fill="url(#vignettePack)"/>
</svg>
